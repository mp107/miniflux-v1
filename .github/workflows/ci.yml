name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress --optimize-autoloader

jobs:
  # ===========================================================================
  # Modern PHP Tests (7.1 - 8.2) - Unit tests only
  # ===========================================================================
  php-tests:
    name: PHP ${{ matrix.php }} - ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.0', '5.6']
        db: [sqlite, postgres, mysql]
        exclude:
          - db: postgres
            php: '7.0'
          - db: mysql
            php: '7.0'
          - db: postgres
            php: '5.6'
          - db: mysql
            php: '5.6'

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miniflux_test
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: miniflux_test
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - run: vendor/bin/phpunit -c tests/phpunit.unit.sqlite.xml

  # ===========================================================================
  # Functional Tests - Requires PHP server running in background
  # ===========================================================================
  functional-tests:
    name: Functional Tests (SQLite)
    runs-on: ubuntu-latest
    needs: [php-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Start PHP server
        uses: webfactory/php-server@v2
        with:
          working_directory: ./
          port: 8080

      - name: Run functional tests
        run: vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml
  # ===========================================================================
  # Security Scan
  # ===========================================================================
  # security-scan:
  #   name: Security Scan
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: shivammathur/setup-php@v2
  #       with:
  #         php-version: '8.2'
  #         extensions: mbstring, xml, json, curl
  #         coverage: none

  #     - run: composer install ${{ env.COMPOSER_FLAGS }}

  #     - run: composer audit || echo "No vulnerabilities found"

  # ===========================================================================
  # Build Docker Image (only on master)
  # ===========================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mp107/miniflux-v1-legacy:latest