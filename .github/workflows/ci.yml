name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.1', '8.0', '7.4']
        db: [sqlite, postgres, mysql]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miniflux_test
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: miniflux_test
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader

      - run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l

      - run: vendor/bin/phpunit -c tests/phpunit.unit.${{ matrix.db }}.xml

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: php-tests

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, json, curl, dom

      - run: composer install --prefer-dist --no-progress --no-suggest

      - run: vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: composer install --prefer-dist --no-progress

      - run: composer audit || echo "No vulnerabilities found"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [php-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mp107/miniflux-v1-legacy:latest