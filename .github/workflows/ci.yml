            ./vendor/bin/phpunit -c tests/phpunit.unit.sqlite.xml || echo "No SQLite unit tests found"
          fi

      - name: PHPUnit - Postgres Unit Tests
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit -c tests/phpunit.unit.postgres.xml || echo "No Postgres unit tests found"
          fi

      - name: PHPUnit - MySQL Unit Tests
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit -c tests/phpunit.unit.mysql.xml || echo "No MySQL unit tests found"
          fi

      - name: PHPUnit - SQLite Functional Tests
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml || echo "No SQLite functional tests found"
          fi

      - name: PHPUnit - Postgres Functional Tests
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit -c tests/phpunit.functional.postgres.xml || echo "No Postgres functional tests found"
          fi

      - name: PHPUnit - MySQL Functional Tests
        run: |
          if [ -f "vendor/bin/phpunit" ]; then
            ./vendor/bin/phpunit -c tests/phpunit.functional.mysql.xml || echo "No MySQL functional tests found"
          fi

      - name: Linter - PHP Syntax Check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Recent git log ==="
          git log --oneline -10 || true
          echo "=== Composer status ==="
          composer --version || true
          echo "=== PHP version ==="
          php -v || true
