name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress --optimize-autoloader
jobs:
  # ===========================================================================
  # PHP Tests - Unit tests across all PHP versions
  # ===========================================================================
  php-tests:
    name: PHP ${{ matrix.php }} Unit Tests (SQLite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.0', '5.6']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2
          ini-values: |
            allow_url_fopen = On
            allow_url_include = Off

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: PHP syntax check
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l || echo "Syntax check completed"

      - name: Run unit tests
        run: vendor/bin/phpunit -c tests/phpunit.unit.sqlite.xml

  # ===========================================================================
  # Functional Tests with standalone HTTP server
  # ===========================================================================
  functional-tests:
    name: Functional Tests (SQLite)
    runs-on: ubuntu-latest
    needs: [php-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml, json, curl, dom, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
          ini-values: |
            allow_url_fopen = On
            allow_url_include = Off

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Fix permissions for SQLite
        run: |
          mkdir -p data
          chmod -R 777 data

      - name: Start PHP server in background with logging
        run: |
          # Start server and capture output
          php -S 127.0.0.1:8080 -t ${{ github.workspace }} > php-server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo $SERVER_PID > php_server.pid
          sleep 2

      - name: Wait for server and run tests
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/tests/ci/feed.xml 2>/dev/null)
            if [[ "$RESPONSE" =~ ^(200)$ ]]; then
              echo "Server ready! HTTP response: $RESPONSE"
              
              # Test JSON-RPC endpoint specifically
              echo "Testing JSON-RPC endpoint..."
              curl -v -X POST -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"getVersion","id":1}' \
                http://127.0.0.1:8080/jsonrpc.php
              
              echo "--- Running functional tests ---"
              set +e 
              vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml
              TEST_EXIT_CODE=$?
              set -e
              
              echo "=== Final PHP Server Log ==="
              cat php-server.log 2>/dev/null
              
              exit $TEST_EXIT_CODE
            fi
            echo "Attempt $i: Server not ready (HTTP: $RESPONSE)"
            sleep 1
          done
          echo "Server failed to start after 30 seconds"
          cat php-server.log 2>/dev/null
          exit 1

  # ===========================================================================
  # Build Docker Image (only on master)
  # ===========================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mp107/miniflux-v1-legacy:latest