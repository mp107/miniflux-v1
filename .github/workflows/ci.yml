name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress --optimize-autoloader

jobs:
  # ===========================================================================
  # PHP Tests - Unit tests across all PHP versions
  # ===========================================================================
  php-tests:
    name: PHP ${{ matrix.php }} Unit Tests (SQLite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.0', '5.6']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: PHP syntax lint
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l || echo "Syntax check completed"

      - name: Run unit tests
        run: vendor/bin/phpunit -c tests/phpunit.unit.sqlite.xml

  # ===========================================================================
  # Functional Tests with standalone HTTP server
  # ===========================================================================
  functional-tests:
    name: Functional Tests (SQLite)
    runs-on: ubuntu-latest
    needs: [php-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '5.6'
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: Start PHP server in background
        run: php -S 127.0.0.1:8080 -t ${{ github.workspace }} > /dev/null 2>&1 & echo $! > php_server.pid

      - name: Debug - Show PHP server status
        run: |
          echo "=== Checking if server is running ==="
          ps aux | grep "php -S" | grep -v grep || echo "Server process not found"
          
          echo ""
          echo "=== PHP Server Log ==="
          cat php-server.log 2>/dev/null || echo "Log file not found or empty"
          
          echo ""
          echo "=== Network Status ==="
          ss -tlnp | grep 8080 || echo "Port 8080 not listening"
          
          echo ""
          echo "=== Available files in ${{ github.workspace }} ==="
          ls -la ${{ github.workspace }} | head -10

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ 2>/dev/null | grep -qE "200|404"; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start after 30 seconds"
          exit 1

      - name: Run functional tests
        run: vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  # security-scan:
  #   name: Security Scan
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: shivammathur/setup-php@v2
  #       with:
  #         php-version: '8.2'
  #         extensions: mbstring, xml, json, curl
  #         coverage: none

  #     - run: composer install ${{ env.COMPOSER_FLAGS }}

  #     - run: composer audit || echo "No vulnerabilities found"

  # ===========================================================================
  # Build Docker Image (only on master)
  # ===========================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mp107/miniflux-v1-legacy:latest