name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress --optimize-autoloader

jobs:
  php-tests-modern:
    name: PHP ${{ matrix.php }} - ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.1', '8.0', '7.4', '7.3', '7.2', '7.1', '7.0', '5.6']
        db: [sqlite, postgres, mysql]
        exclude:
          - db: postgres
            php: '7.0'
          - db: mysql
            php: '7.0'
          - db: postgres
            php: '5.6'
          - db: mysql
            php: '5.6'

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miniflux_test
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: miniflux_test
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install ${{ env.COMPOSER_FLAGS }}

      - name: PHP syntax lint
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l

      - name: Run tests
        run: vendor/bin/phpunit -c tests/phpunit.unit.${{ matrix.db }}.xml
          tags: mp107/miniflux-v1-legacy:latest