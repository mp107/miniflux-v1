name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'develop'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

env:
  COMPOSER_FLAGS: --no-interaction --prefer-dist --no-progress --optimize-autoloader

jobs:
  php-tests-modern:
    name: PHP ${{ matrix.php }} - ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.1', '8.0', '7.4', '7.3', '7.2', '7.1']
        db: [sqlite, postgres, mysql]
        exclude:
          - db: postgres
            php: '7.1'
          - db: mysql
            php: '7.1'

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miniflux_test
        ports:
          - 5432:5432

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: miniflux_test
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, json, curl, dom
          coverage: none
          tools: composer:v2
      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l

      - run: vendor/bin/phpunit -c tests/phpunit.unit.${{ matrix.db }}.xml

  php-tests-legacy:
    name: PHP ${{ matrix.php }} (SQLite)
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        php: ['7.0', '5.6']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release ca-certificates apt-transport-https software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y php${{ matrix.php }} php${{ matrix.php }}-mbstring php${{ matrix.php }}-xml php${{ matrix.php }}-curl php${{ matrix.php }}-json

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - run: find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" | xargs -r php -l || echo "Syntax check skipped for legacy PHP"

      - run: vendor/bin/phpunit -c tests/phpunit.unit.sqlite.xml

  functional-tests:
    name: Functional Tests (SQLite)
    runs-on: ubuntu-latest
    needs: [php-tests-modern]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, json, curl, dom
          coverage: none

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - run: vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, json, curl
          coverage: none

      - run: composer install ${{ env.COMPOSER_FLAGS }}

      - run: composer audit || echo "No vulnerabilities found"

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-tests-modern, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mp107/miniflux-v1-legacy:latest
