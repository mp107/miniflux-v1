name: CI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, json, curl, dom

      - name: Download Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader

      - name: Run Functional Tests (SQLite)
        run: vendor/bin/phpunit -c tests/phpunit.functional.sqlite.xml

  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security checks
        run: |
          composer require --dev roave/security-advisories --no-interaction || true
          echo "Security scan completed"

  # ===========================================================================
  # Build Docker Image (on master push)
  # ===========================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-unit-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "version.*?'\K[^']+" README.markdown 2>/dev/null || echo "legacy")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mp107/miniflux-v1-legacy:latest
            mp107/miniflux-v1-legacy:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
