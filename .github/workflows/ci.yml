name: CI
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run static analysis
        run: |
          composer require --dev phpstan/phpstan --no-interaction --no-progress || true
          vendor/bin/phpstan analyse app --level=5 --error-format=table || true

  # ===========================================================================
  # Build Docker Image (on master push)
  # ===========================================================================
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [php-unit-tests, functional-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP "version.*?'\K[^']+" README.markdown 2>/dev/null || echo "latest")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=mp107/miniflux-v1-legacy:$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            mp107/miniflux-v1-legacy:latest
            mp107/miniflux-v1-legacy:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
